services:
  # ShilpSetu FastAPI Backend
  - type: web
    name: shilpsetu-backend
    runtime: python
    buildCommand: "cd backend && pip install -r requirements.txt && python scripts/generate_sample_crafts.py"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: ZERO_FAIL_MODE
        value: "true"

  # ShilpSetu Frontend Web Client
  - type: web
    name: shilpsetu-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
