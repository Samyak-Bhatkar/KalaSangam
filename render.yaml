services:
  # KalaSangam FastAPI Backend
  - type: web
    name: kalasangam-backend
    runtime: python
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt && python scripts/generate_sample_crafts.py"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: ZERO_FAIL_MODE
        value: "true"

  # KalaSangam Frontend Web Client
  - type: web
    name: kalasangam-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_BASE_URL
        value: https://kalasangam-backend-xj65.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
